[package]
name = "pubsplash"
version = "0.1.2"
edition = "2024"
# Several binaries live here, so `cargo run` is ambiguous without naming the
# default target.
default-run = "pubsplash"

# Loads a single VST plugin and reports its info; kept out-of-process so a
# crashing plugin cannot take down Pubsplash during a scan.
[[bin]]
name = "pubsplash-scan"
path = "src/bin/scan_helper.rs"

# Standalone Sound Pack Manager, launched from Tools > Sound Pack Manager.
# Shipped alongside pubsplash.exe, which resolves it as a sibling.
[[bin]]
name = "pubsplash-soundpack"
path = "src/bin/soundpack_manager.rs"

# Command-line pack compiler, the same job as the manager's Compile button.
# Auto-discovered from src/bin anyway; spelled out here so the shipping list
# below is checkable against this one.
[[bin]]
name = "soundpack"
path = "src/bin/soundpack.rs"

# Dev tool: scans the UI source for `help::tag(..)` calls and round-trips the
# hand-authored context-help strings in help.toml. Not shipped.
[[bin]]
name = "gen-help"
path = "src/bin/gen_help.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
wxdragon = "0.9"

log = "0.4"
# `async` gives `WriteMode::Async`, which keeps log writes off the audio
# engine's mix thread (it logs from inside the 10 ms block loop).
flexi_logger = { version = "0.31", features = ["async"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"

crossbeam-channel = "0.5"

# The network side runs on a single current-thread runtime, so `rt-multi-thread`
# is deliberately absent; adding a need for it will fail the build loudly.
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }
# Only `StreamExt` is used; the default feature set pulls in far more.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"

# Edge and Star speak WebSocket, not HTTP. `native-tls` rather than rustls so
# this shares reqwest's schannel-backed TLS stack instead of linking a second one.
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
# Only Google Translate and Star return compressed audio; every other speech API
# is asked for PCM or WAV, which `hound` already reads.
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
# Edge's Sec-MS-GEC token and Polly's SigV4 signature.
sha2 = "0.10"
hmac = "0.12"
urlencoding = "2"

wasapi = "0.23"
mp3lame-encoder = "0.2"
rtrb = "0.3"
hound = "3.5"
vst3-host = { version = "0.7", default-features = false }
aes-gcm = "0.10"
rand = "0.8"
bincode = "1.3"
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
windows-core = "0.62.2"
windows = { version = "0.62", features = ["Win32_Media_Speech", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Foundation", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_System_Variant", "Win32_System_Ole", "Win32_Security_Cryptography"] }

[package.metadata.packager]
before-packaging-command = "cargo build --release --bin pubsplash --bin pubsplash-scan --bin pubsplash-soundpack --bin soundpack"
identifier = "com.github.ironcross32.pubsplash"
formats = ["nsis"]
icons = ["assets/icon/pubsplash.ico"]
# Extra files copied next to the exe in the install directory, which is where
# the Help menu looks for them. Both are generated from the Markdown sources at
# package time (see the release workflow's "Convert docs to HTML" step) —
# a local `cargo packager` run needs them produced first.
resources = ["readme.html", "changelog.html"]

# Listed explicitly so the dev-only gen-help tool is not installed: with this
# unset, cargo-packager auto-detects every [[bin]] target in the manifest.
# Paths are binary names without `.exe`, resolved against target/release.
binaries = [
  { path = "pubsplash", main = true },
  { path = "pubsplash-scan" },
  { path = "pubsplash-soundpack" },
  { path = "soundpack" },
]

# Let the user choose per-user (AppData\Local) or per-machine (Program Files,
# elevation prompted) at install time, instead of forcing the per-user default.
[package.metadata.packager.nsis]
installer-mode = "both"
