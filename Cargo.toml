[package]
name = "pubsplash"
version = "0.1.0"
edition = "2024"
# Two binaries live here (pubsplash + the out-of-process pubsplash-scan helper),
# so `cargo run` is ambiguous without naming the default target.
default-run = "pubsplash"

# Loads a single VST plugin and reports its info; kept out-of-process so a
# crashing plugin cannot take down Pubsplash during a scan.
[[bin]]
name = "pubsplash-scan"
path = "src/bin/scan_helper.rs"

# Dev tool: scans the UI source for `help::tag(..)` calls and round-trips the
# hand-authored context-help strings in help.toml. Not shipped.
[[bin]]
name = "gen-help"
path = "src/bin/gen_help.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
wxdragon = "0.9"

log = "0.4"
flexi_logger = "0.31"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"

crossbeam-channel = "0.5"

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }
futures-util = "0.3"
thiserror = "2"

wasapi = "0.23"
mp3lame-encoder = "0.2"
rtrb = "0.3"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
windows-core = "0.62.2"
windows = { version = "0.62", features = ["Win32_Media_Speech", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Foundation", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_System_Variant", "Win32_System_Ole"] }

[package.metadata.packager]
before-packaging-command = "cargo build --release"
identifier = "com.github.ironcross32.pubsplash"
formats = ["nsis"]
icons = ["assets/icon/pubsplash.ico"]
# Extra files copied next to the exe in the install directory. readme.html is
# generated at package time (see the release workflow / README build step) —
# a local `cargo packager` run needs it produced first.
resources = ["readme.html", "changelog.md"]

# Let the user choose per-user (AppData\Local) or per-machine (Program Files,
# elevation prompted) at install time, instead of forcing the per-user default.
[package.metadata.packager.nsis]
installer-mode = "both"