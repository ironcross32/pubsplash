# Cuts a GitHub Release (NSIS installer + portable ZIP) on any v* tag push.
#
# Can also be started by hand from the Actions tab ("Run workflow") against any
# branch, to test packaging without cutting a release: those runs skip the
# release step and attach the installer and ZIP to the run as artifacts instead.
# The manual button only appears while this trigger is on the default branch,
# and a branch can only be dispatched if its own copy of this file has it too.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Ninja
        run: choco install ninja -y

      # A tag is the only thing that publishes, so it is the only thing that
      # has to agree with the tree. The tag names the artifacts (see the Zip and
      # upload steps) while the About box and the installer take their version
      # from Cargo.toml -- so a mismatch ships binaries that disagree with their
      # own file names. Manual runs have no tag and skip this.
      - name: Check the tag against Cargo.toml and the changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not vX.Y.Z"
            exit 1
          fi
          version="${tag#v}"
          # The first `version = "..."` in Cargo.toml is the package's own; the
          # dependency table comes later and must not be matched.
          manifest="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')"
          if [[ "$manifest" != "$version" ]]; then
            echo "::error::Tag '$tag' does not match Cargo.toml version '$manifest'"
            exit 1
          fi
          if ! grep -qE "^## +\[?${version//./\\.}\]?" changelog.md; then
            echo "::error::changelog.md has no '## $version' heading"
            exit 1
          fi
          # agents.md: entries live under Unreleased until a release moves them
          # into a version heading. Anything still there at tag time did not make
          # it into the release notes.
          leftovers="$(awk '/^## /{ inside = ($0 ~ /^## +Unreleased/) ; next } inside && /^[-*] /' changelog.md || true)"
          if [[ -n "$leftovers" ]]; then
            echo "::error::changelog.md still has entries under '## Unreleased':"
            echo "$leftovers"
            exit 1
          fi
          echo "Releasing $version"

      # Before packaging, not after: a release that fails its own test suite
      # should never reach the packaging step, let alone the Releases page.
      - name: Run tests
        run: cargo test --all-targets

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # Must run before packaging: both HTML files are bundled into the installer
      # as packager resources (see Cargo.toml), so they have to exist on disk
      # first. HTML rather than Markdown because Help > Open Readme and Help >
      # View Changelog hand these to the default browser.
      - name: Convert docs to HTML
        run: |
          npm install -g marked
          marked README.md -o readme.html
          marked changelog.md -o changelog.html
        shell: bash

      # Builds the exe via the configured before-packaging-command
      # (cargo build --release) and produces the NSIS installer in target/release.
      - name: Package installer
        run: cargo packager --release

      - name: Assemble portable ZIP
        shell: bash
        run: |
          mkdir bundle
          # Every user-facing binary — keep this list in step with the
          # `binaries` key in Cargo.toml. pubsplash.exe resolves its helpers as
          # siblings of itself, so a ZIP missing one breaks Tools > Sound Pack
          # Manager or the VST plugin scan. gen-help is a dev tool and is
          # deliberately left out. The default sound pack is embedded in the exe
          # at compile time, so there are no loose assets to copy.
          cp target/release/pubsplash.exe bundle/
          cp target/release/pubsplash-scan.exe bundle/
          cp target/release/pubsplash-soundpack.exe bundle/
          cp target/release/pubsplash-update.exe bundle/
          cp target/release/soundpack.exe bundle/
          cp readme.html bundle/
          cp changelog.html bundle/
          # How Pubsplash knows it is the portable build and must replace its
          # own folder rather than run the installer. The installer's $INSTDIR
          # has an uninstall.exe and no marker; this has the marker and no
          # uninstaller. See src/update/install_kind.rs, which reads this file's
          # presence only -- the text is for whoever opens it.
          cat > bundle/portable.txt <<'EOF'
          This is the portable build of Pubsplash. Everything it needs is in this
          folder; nothing is installed and nothing is written to the registry.

          Move the whole folder wherever you like and run pubsplash.exe. Your
          settings, logs and crash dumps live in %LOCALAPPDATA%\pubsplash, not
          here, so they survive an update.

          Do not delete this file: Pubsplash reads it to tell a portable copy
          from an installed one when it updates itself.
          EOF

      - name: Zip bundle
        shell: pwsh
        run: Compress-Archive -Path bundle/* -DestinationPath "pubsplash-${{ github.ref_name }}.zip"

      # `debug = "line-tables-only"` in Cargo.toml's release profile puts a .pdb
      # beside each binary. Nothing needs them to run, so they stay out of both
      # the installer and the portable ZIP -- but a minidump from src/crash.rs
      # is only readable in our own frames with the .pdb the exe was built with,
      # and that exact build exists nowhere else once the runner is gone. So
      # they ship as their own asset, matched to the release by its tag.
      #
      # Globbed rather than listed: cargo names a .pdb after the crate, not the
      # binary (pubsplash-scan.exe -> pubsplash_scan.pdb), and dependency PDBs
      # live under target/release/deps, not here.
      - name: Zip debug symbols
        shell: pwsh
        run: Compress-Archive -Path target/release/*.pdb -DestinationPath "pubsplash-${{ github.ref_name }}-debug-symbols.zip"

      # Everything the updater and the README's download links reach for lives at
      # `releases/latest/download/<name>`, which only works if the name has no
      # version in it. So each artifact is *copied*, not renamed: the versioned
      # name stays for humans and for telling one downloaded file from another,
      # and the stable copy beside it is what the fixed URLs resolve to. A few
      # megabytes of release storage per tag buys a link that never has to be
      # edited again.
      #
      # The debug-symbols ZIP deliberately gets no stable name: nothing should be
      # able to fetch it by guessing, and it is matched to a release by its tag.
      - name: Copy artifacts to stable names
        shell: bash
        run: |
          set -euo pipefail
          cp target/release/*-setup.exe pubsplash-setup.exe
          cp "pubsplash-${GITHUB_REF_NAME}.zip" pubsplash-portable.zip

      # The manifest Pubsplash reads to decide whether an update exists. Written
      # here rather than read from the GitHub API because api.github.com is rate
      # limited per IP -- which a shared or NAT'd network exhausts through no
      # fault of the user -- and because the API cannot carry a checksum. The
      # SHA-256s are what make a truncated or tampered download detectable before
      # anything is run; see src/update/http.rs, which verifies size then hash.
      #
      # `version` has no `v`: it is compared against CARGO_PKG_VERSION. Manual
      # runs have no tag, so they get the manifest version from Cargo.toml and
      # the notes URL from the branch -- enough to eyeball the file, and never
      # published.
      - name: Write latest.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            $version = $tag.Substring(1)
          } else {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          }
          function Describe($path) {
            $item = Get-Item $path
            return [ordered]@{
              name   = $item.Name
              sha256 = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
              size   = $item.Length
            }
          }
          $manifest = [ordered]@{
            version   = $version
            notes_url = "https://github.com/${{ github.repository }}/releases/tag/$tag"
            installer = Describe "pubsplash-setup.exe"
            portable  = Describe "pubsplash-portable.zip"
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File latest.json -Encoding utf8
          Get-Content latest.json

      # Manual runs stop here: the build is downloadable from the run's summary
      # page for 90 days, and nothing is published. The `pubsplash-*.zip` glob
      # here and in the release step covers the debug-symbols ZIP and the two
      # portable ones. latest.json is included so a manual run can be checked --
      # download it and confirm its hashes match the assets beside it.
      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pubsplash-${{ github.ref_name }}
          path: |
            target/release/*-setup.exe
            pubsplash-*.zip
            pubsplash-setup.exe
            latest.json

      # Guarded on the ref rather than the event so this can only ever publish
      # from a tag, however the workflow was started.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/*-setup.exe
            pubsplash-*.zip
            pubsplash-setup.exe
            latest.json
          generate_release_notes: true
